<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="flex flex-col h-full overflow-hidden bg-slate-900">
  <div class="hdr">
    <span class="text-sm font-semibold text-white flex-1 min-w-0 truncate" id="file-name">archivo.map</span>
    <span class="text-xs text-slate-400" id="line-indicator">Linea: 1</span>
    <span class="text-xs status-msg" id="status-msg"></span>
    <button type="button" class="btn" data-cmd="find" title="Ctrl+F">Buscar</button>
    <button type="button" class="btn btn-success" data-cmd="save" title="Ctrl+S">Guardar archivo</button>
    <button type="button" class="btn btn-danger" data-cmd="close" title="Esc">Cerrar</button>
  </div>
  <div id="find-bar" class="find-bar hidden">
    <input id="find-input" type="text" placeholder="Buscar…" />
    <button type="button" class="btn" id="find-prev">Anterior</button>
    <button type="button" class="btn" id="find-next">Siguiente</button>
    <span id="find-count" class="text-xs text-slate-400"></span>
    <button type="button" class="btn" id="find-close">Cerrar</button>
  </div>
  <textarea id="editor" class="editor-text scroll-y" spellcheck="false" autocapitalize="off"
            autocomplete="off" wrap="off"></textarea>
  <div id="ctx-menu" class="ctx-menu hidden">
    <button type="button" data-edit="undo">Deshacer</button>
    <button type="button" data-edit="redo">Rehacer</button>
    <hr />
    <button type="button" data-edit="cut">Cortar</button>
    <button type="button" data-edit="copy">Copiar</button>
    <button type="button" data-edit="paste">Pegar</button>
    <button type="button" data-edit="selectAll">Seleccionar todo</button>
    <hr />
    <button type="button" data-edit="find">Buscar…</button>
  </div>
</body>
</html>
