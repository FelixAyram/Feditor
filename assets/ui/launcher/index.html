<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../shared/tw.css">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: "Segoe UI", sans-serif; }
    .hdr { padding: 12px 16px; border-bottom: 1px solid #334155; background: #1e293b; }
    .footer { padding: 12px 16px; border-top: 1px solid #334155; background: #1e293b; display: flex; justify-content: flex-end; gap: 8px; }
    .list { border: 1px solid #334155; border-radius: 6px; background: #0f172a; display: flex; flex-direction: column; overflow: hidden; }
    .list-h { padding: 6px 10px; font-size: 11px; text-transform: uppercase; color: #94a3b8; border-bottom: 1px solid #334155; }
    .list-b { overflow-y: auto; }
    .list-item { display: block; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: transparent; color: #e2e8f0; cursor: pointer; font-size: 13px; }
    .list-item:hover { background: #334155; }
    .list-item.sel { background: #2563eb; }
    .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid #475569; background: #334155; color: #e2e8f0; cursor: pointer; }
    .btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn-ghost { background: transparent; border-color: transparent; color: #94a3b8; }
    .btn-ghost:hover { background: rgba(255,255,255,.08); color: #e2e8f0; }
  </style>
</head>
<body class="flex flex-col h-full">
  <header class="hdr">
    <div>
      <div class="text-lg font-bold text-white">OMSI F4 Engine</div>
      <div class="text-sm text-slate-400" id="subtitle">Mapa y entrypoint</div>
    </div>
  </header>
  <main class="flex flex-col flex-1 min-h-0 gap-3 p-4" id="main">
    <div class="flex flex-col flex-1 min-h-0 gap-2 max-h-40" id="map-block">
      <span class="text-xs font-semibold text-slate-400 uppercase">Mapa</span>
      <div class="list flex-1 min-h-0">
        <div class="list-h flex justify-between"><span>Mapas</span><span id="map-count" class="text-slate-500">0</span></div>
        <div class="list-b scroll-y flex-1" id="map-list"></div>
      </div>
    </div>
    <div class="flex flex-col flex-1 min-h-0 gap-2">
      <span class="text-xs font-semibold text-slate-400 uppercase">Entrypoint</span>
      <div class="list flex-1 min-h-0">
        <div class="list-h flex justify-between"><span>Entrypoints</span><span id="ep-count" class="text-slate-500">0</span></div>
        <div class="list-b scroll-y flex-1" id="entry-list"></div>
      </div>
    </div>
  </main>
  <footer class="footer">
    <button type="button" class="btn btn-ghost" id="btn-cancel">Cancelar</button>
    <button type="button" class="btn btn-primary" id="btn-ok">Iniciar</button>
  </footer>
  <script src="app.js"></script>
</body>
</html>
